<title>Grid Sampler Manual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<style>
/* Layout: a printed manual's contents on the left, one numbered section on the right: how to reach it, a figure, its knobs. */
:root {
  --paper: #ffffff; --ink: #111111; --grey: #666666; --rule: #d9d9d9;
  --text: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --device: "Silkscreen", "Courier New", monospace;  /* close to the screen's own 5x7 lettering */
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #0d0d0d; --ink: #ededed; --grey: #9a9a9a; --rule: #333333; color-scheme: dark; } }
:root[data-theme="dark"] { --paper: #0d0d0d; --ink: #ededed; --grey: #9a9a9a; --rule: #333333; color-scheme: dark; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--text); font-size: 16px; line-height: 1.5; padding-inline: 16px; padding-block: 32px 64px; }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; align-items: start; }
header { grid-column: 1 / -1; border-bottom: 2px solid var(--ink); padding-bottom: 12px; }
h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
header p { margin: 6px 0 0; color: var(--grey); max-width: 68ch; }
nav { position: sticky; top: env(safe-area-inset-top, 0px); max-height: 100vh; overflow-y: auto; padding-block: 4px 24px; font-size: 14px; }
nav ol { list-style: none; margin: 0; padding: 0; }
nav > ol > li { margin-bottom: 14px; }
nav .chapter { font-weight: 700; margin-bottom: 2px; }
nav button { all: unset; cursor: pointer; display: block; padding: 1px 0; color: var(--ink); }
nav button span { display: inline-block; width: 2.6em; color: var(--grey); font-variant-numeric: tabular-nums; }
nav button:hover { text-decoration: underline; }
nav button[aria-current="true"] { font-weight: 700; }
nav button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
select { display: none; width: 100%; font: inherit; padding: 8px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); }
main { min-width: 0; }
.chapter-name { color: var(--grey); margin: 0; }
main h2 { font-size: 26px; margin: 0 0 16px; display: flex; gap: 14px; align-items: baseline; }
main h2 .num { font-weight: 400; color: var(--grey); font-variant-numeric: tabular-nums; }
.route { margin: 0 0 20px; max-width: 68ch; }
.route b { font-weight: 700; }
figure { margin: 0 0 20px; max-width: 760px; }
figure img { display: block; width: 100%; max-width: 100%; height: auto; aspect-ratio: 3 / 2; image-rendering: pixelated; border: 1px solid var(--ink); }
figcaption { font-size: 13px; color: var(--grey); margin-top: 6px; }
.about { margin: 0 0 12px; max-width: 68ch; }
.table { overflow-x: auto; margin-top: 24px; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; vertical-align: top; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--rule); }
th { font-weight: 700; border-bottom: 2px solid var(--ink); }
td.k { white-space: nowrap; width: 1%; font-variant-numeric: tabular-nums; }
td.n { font-family: var(--device); font-size: 13px; white-space: nowrap; width: 1%; padding-top: 10px; }
.note { color: var(--grey); font-size: 14px; max-width: 68ch; margin: 12px 0 0; }
@media (max-width: 760px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  nav { display: none; }
  select { display: block; }
}
</style>

<div class="wrap">
  <header>
    <h1>Grid Sampler</h1>
    <p>Every screen, how to get to it, and what each of the eight knobs does on it. Panel buttons are those planned for the next hardware revision; until then the Launchpad stand-ins do the same.</p>
  </header>
  <nav id="nav" aria-label="Contents"></nav>
  <main>
    <select id="pick" aria-label="Section"></select>
    <div id="page"></div>
  </main>
</div>

const nav = document.getElementById("nav"), pick = document.getElementById("pick"), pageEl = document.getElementById("page");
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids.filter(k => k != null)); return e; };

const groups = [...new Set(SCREENS.map(s => s.group))];
// Numbered like a printed manual: chapter per group, section per screen.
SCREENS.forEach(s => {
  const c = groups.indexOf(s.group) + 1;
  s.num = c + "." + (SCREENS.filter(x => x.group === s.group).indexOf(s) + 1);
});
const contents = el("ol");
groups.forEach((g, i) => {
  const items = el("ol");
  const og = el("optgroup", { label: (i + 1) + "  " + g });
  for (const s of SCREENS.filter(x => x.group === g)) {
    items.append(el("li", {}, el("button", { type: "button", id: "nav-" + s.id, onclick: () => show(s.id) },
      el("span", { textContent: s.num }), s.title)));
    og.append(el("option", { value: s.id, textContent: s.num + "  " + s.title }));
  }
  contents.append(el("li", {}, el("div", { className: "chapter", textContent: (i + 1) + "  " + g }), items));
  pick.append(og);
});
nav.append(contents);
pick.onchange = () => show(pick.value);

function figure(name, caption) {
  return el("figure", {}, el("img", { src: IMAGES[name], alt: caption, width: 480, height: 320 }),
    el("figcaption", { textContent: caption }));
}

function show(id) {
  const s = SCREENS.find(x => x.id === id) || SCREENS[0];
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-current", b.id === "nav-" + s.id));
  pick.value = s.id;
  if (location.hash.slice(1) !== s.id) history.replaceState(null, "", "#" + s.id);
  const parts = [el("p", { className: "chapter-name", textContent: groups.indexOf(s.group) + 1 + "  " + s.group }),
    el("h2", {}, el("span", { className: "num", textContent: s.num }), s.title)];
  if (s.route) {
    parts.push(el("p", { className: "route" }, el("b", { textContent: "Get there: " }), s.route[0] + ". ",
      el("b", { textContent: "On the Launchpad: " }), s.route[1] + "."));
  }
  if (s.img) parts.push(figure(s.img, "Figure " + s.num + ". " + s.title));
  for (const p of s.about || []) parts.push(el("p", { className: "about", textContent: p }));
  if (s.extra) parts.push(figure(s.extra, "Figure " + s.num + "b. BUS B with a delay"));
  if (s.knobs) {
    const body = el("tbody");
    for (const [k, name, turn, push] of s.knobs) {
      body.append(el("tr", {},
        el("td", { className: "k", textContent: k }),
        el("td", { className: "n", textContent: name || "-" }),
        el("td", { textContent: turn || "" }),
        el("td", { textContent: push || "" })));
    }
    parts.push(el("div", { className: "table" }, el("table", {},
      el("thead", {}, el("tr", {}, ...["Knob", "Setting", "Turn", "Push"].map(h => el("th", { textContent: h })))), body)));
    parts.push(el("p", { className: "note", textContent: "Knobs not listed do nothing here. Shift + push puts most settings back to how a new one has them." }));
  }
  if (s.table) {
    const body = el("tbody");
    for (const row of s.table.rows) body.append(el("tr", {}, ...row.map(c => el("td", { textContent: c }))));
    parts.push(el("div", { className: "table" }, el("table", {},
      el("thead", {}, el("tr", {}, ...s.table.head.map(h => el("th", { textContent: h })))), body)));
  }
  pageEl.replaceChildren(...parts);
  window.scrollTo(0, 0);
}
